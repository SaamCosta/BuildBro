plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"buildbro" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// ./gradlew test -Dbuildbro.e2e=true runs the end-to-end test against the real Claude Code
	["buildbro.e2e", "buildbro.claude"].each { key ->
		def value = providers.systemProperty(key).orNull
		if (value != null) {
			systemProperty key, value
		}
	}
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// ./gradlew deployTest builds the mod and puts it in the test instance named in local.properties (test.instance=...)
def localProperties = new Properties()
def localFile = file("local.properties")
if (localFile.exists()) {
	localFile.withInputStream { localProperties.load(it) }
}
def testInstance = localProperties.getProperty("test.instance")?.trim() ?: null

def removeOldTestJar = tasks.register("removeOldTestJar", Delete) {
	onlyIf { testInstance != null }
	if (testInstance != null) {
		delete fileTree("${testInstance}/mods") { include "buildbro-*.jar" }
	}
}

tasks.register("deployTest", Copy) {
	group = "buildbro"
	description = "Builds the mod and copies it into the test instance from local.properties"
	dependsOn removeOldTestJar
	onlyIf { testInstance != null }
	from tasks.named("jar")
	into(testInstance != null ? "${testInstance}/mods" : layout.buildDirectory.dir("no-test-instance"))
}
